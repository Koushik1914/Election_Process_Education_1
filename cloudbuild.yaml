# Cloud Build pipeline for JanVoice AI
# Triggered automatically on push to main branch
#
# Steps:
#   1. Install deps & run tests
#   2. Build Docker image
#   3. Push to Artifact Registry
#   4. Deploy to Cloud Run

substitutions:
  _REGION: asia-south1          # Mumbai — lowest latency for Indian users
  _SERVICE_NAME: janvoice-ai
  _AR_REPO: janvoice-repo

steps:

  # ── Step 1: Run test suite ──────────────────────────────────────────────────
  - name: node:18-slim
    id: test
    entrypoint: bash
    args:
      - -c
      - |
        npm ci
        npm test
    env:
      - NODE_ENV=test

  # ── Step 2: Build Docker image ──────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --tag
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$COMMIT_SHA
      - --tag
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:latest
      - --cache-from
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:latest
      - .
    waitFor:
      - test

  # ── Step 3: Push to Artifact Registry ──────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME
    waitFor:
      - build

  # ── Step 4: Deploy to Cloud Run ────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --concurrency=80
      - --timeout=30
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,NODE_ENV=production
    waitFor:
      - push

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:$COMMIT_SHA
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO/$_SERVICE_NAME:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
