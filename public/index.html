<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JanVoice AI | Indian Election Fact-Checker</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <span class="jan">Jan</span><span class="voice">Voice</span> <span class="ai">AI</span>
            </div>
            <p class="tagline">Non-partisan Voter Education & Fact-Checking</p>
        </header>

        <main id="chat-container">
            <div id="messages">
                <div class="message bot-message">
                    Hello! I am JanVoice AI. How can I help you today? You can send me a text, a WhatsApp screenshot, or a voice message to verify election claims or learn about the process.
                </div>
            </div>
            <div id="status-indicator" class="hidden">
                <span id="status-text">Processing...</span>
                <div class="spinner"></div>
            </div>
        </main>

        <footer class="input-area">
            <div class="input-wrapper">
                <textarea id="user-input" placeholder="Type a claim or ask a question..."></textarea>
                <div class="action-buttons">
                    <label for="image-upload" class="icon-btn" title="Upload Image">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M21,19V5c0-1.1-0.9-2-2-2H5C3.9,3,3,3.9,3,5v14c0,1.1,0.9,2,2,2h14C20.1,21,21,20.1,21,19z M8.5,13.5l2.5,3.01L14.5,12l4.5,6H5 L8.5,13.5z"/></svg>
                    </label>
                    <input type="file" id="image-upload" accept="image/*" class="hidden">
                    
                    <button id="record-btn" class="icon-btn" title="Record Audio">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12,14c1.66,0,3-1.34,3-3V5c0-1.66-1.34-3-3-3S9,3.34,9,5v6C9,12.66,10.34,14,12,14z M17,11c0,2.76-2.24,5-5,5s-5-2.24-5-5H5 c0,3.53,2.61,6.43,6,6.92V21h2v-3.08c3.39-0.49,6-3.39,6-6.92H17z"/></svg>
                    </button>
                    
                    <button id="send-btn" class="primary-btn">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M2.01,21L23,12L2.01,3L2,10l15,2l-15,2L2.01,21z"/></svg>
                    </button>
                </div>
            </div>
            <p class="disclaimer">Based on official ECI data. JanVoice is non-partisan.</p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
